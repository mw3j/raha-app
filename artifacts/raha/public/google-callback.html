<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>راحة - تسجيل الدخول</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #16a34a;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,.25);
    }
    .logo {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 1.5rem;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #e5e7eb;
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { color: #374151; font-size: 1rem; font-weight: 500; }
    .err { color: #dc2626; }
    .success { color: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">☪️</div>
    <div class="title">راحة</div>
    <div class="subtitle">التطبيق الإسلامي الشامل</div>
    <div class="spinner" id="spinner"></div>
    <p class="msg" id="msg">جارٍ تسجيل الدخول...</p>
  </div>
  <script>
    (async function () {
      const spinner = document.getElementById('spinner');
      const msg = document.getElementById('msg');

      function showError(text) {
        spinner.style.display = 'none';
        msg.className = 'msg err';
        msg.textContent = text;
        setTimeout(function () { window.location.href = '/login'; }, 2500);
      }

      function showSuccess() {
        spinner.style.display = 'none';
        msg.className = 'msg success';
        msg.textContent = 'تم تسجيل الدخول بنجاح!';
        setTimeout(function () { window.location.href = '/'; }, 600);
      }

      try {
        var hash = window.location.hash.substring(1);
        var params = new URLSearchParams(hash);
        var accessToken = params.get('access_token');
        var error = params.get('error');

        if (error) { showError('تم إلغاء تسجيل الدخول'); return; }
        if (!accessToken) { showError('لم يتم استلام رمز الدخول'); return; }

        var res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken: accessToken })
        });
        var data = await res.json();

        if (!res.ok || !data.token) {
          throw new Error(data.message || 'فشل التحقق من Google');
        }

        localStorage.setItem('raha_token', data.token);
        showSuccess();
      } catch (e) {
        showError('فشل تسجيل الدخول — حاول مجدداً');
      }
    })();
  </script>
</body>
</html>
