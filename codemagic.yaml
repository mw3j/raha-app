workflows:
  android-release:
    name: RAHA Android Release (AAB)
    max_build_duration: 60
    environment:
      java: 21
      node: 22
      vars:
        PACKAGE_NAME: "com.raha.islamic"
        COREPACK_ENABLE_STRICT: "0"
      groups:
        - keystore_credentials
    scripts:
      - name: Setup pnpm
        script: |
          export COREPACK_ENABLE_STRICT=0
          npm install -g pnpm@9 --force
          pnpm --version

      - name: Install dependencies
        script: |
          export COREPACK_ENABLE_STRICT=0
          pnpm install --no-frozen-lockfile

      - name: Build web app
        script: |
          export COREPACK_ENABLE_STRICT=0
          pnpm --filter @workspace/raha run build

      - name: Sync Capacitor Android
        script: |
          export COREPACK_ENABLE_STRICT=0
          cd artifacts/raha && npx cap sync android

      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/raha-release.p12
          ls -la /tmp/raha-release.p12

      - name: Build Release AAB
        script: |
          export KEYSTORE_PATH=/tmp/raha-release.p12
          export KEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          export KEY_ALIAS=$CM_KEY_ALIAS
          export KEY_PASSWORD=$CM_KEY_PASSWORD
          cd artifacts/raha/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tail -100

    artifacts:
      - artifacts/raha/android/app/build/outputs/bundle/release/app-release.aab
