workflows:
  android-release:
    name: RAHA Android Release (AAB)
    max_build_duration: 60
    environment:
      java: 17
      node: 20
      vars:
        PACKAGE_NAME: "com.raha.islamic"
      groups:
        - keystore_credentials
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm@9

      - name: Install dependencies
        script: pnpm install --frozen-lockfile

      - name: Build web app
        script: pnpm --filter @workspace/raha run build

      - name: Install Capacitor CLI
        script: cd artifacts/raha && pnpm add -D @capacitor/cli

      - name: Sync Capacitor Android
        script: cd artifacts/raha && npx cap sync android

      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/raha-release.p12

      - name: Build Release AAB
        script: |
          cd artifacts/raha/android
          KEYSTORE_PATH=/tmp/raha-release.p12 \
          KEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD \
          KEY_ALIAS=$CM_KEY_ALIAS \
          KEY_PASSWORD=$CM_KEY_PASSWORD \
          ./gradlew bundleRelease

    artifacts:
      - artifacts/raha/android/app/build/outputs/bundle/release/app-release.aab
      - artifacts/raha/android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - $CM_EMAIL
        notify:
          success: true
          failure: true
