workflows:
  android-release:
    name: RAHA Android Release (AAB)
    max_build_duration: 60
    environment:
      java: 21
      node: 22
      vars:
        PACKAGE_NAME: "com.raha.islamic"
        COREPACK_ENABLE_STRICT: "0"
        CM_KEY_ALIAS: "raha_key"
        CM_KEYSTORE_PASSWORD: "raha2026Secure"
        CM_KEY_PASSWORD: "raha2026Secure"
      groups:
        - keystore_credentials
    scripts:
      - name: Setup pnpm
        script: |
          export COREPACK_ENABLE_STRICT=0
          npm install -g pnpm@9 --force
          pnpm --version

      - name: Install dependencies
        script: |
          export COREPACK_ENABLE_STRICT=0
          pnpm install --no-frozen-lockfile

      - name: Build web app
        script: |
          export COREPACK_ENABLE_STRICT=0
          pnpm --filter @workspace/raha run build

      - name: Sync Capacitor Android
        script: |
          export COREPACK_ENABLE_STRICT=0
          cd artifacts/raha && npx cap sync android

      - name: Generate keystore
        script: |
          keytool -genkey -v \
            -keystore /tmp/raha-release.jks \
            -alias raha_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass raha2026Secure \
            -keypass raha2026Secure \
            -storetype JKS \
            -dname "CN=RAHA App, OU=Dev, O=RAHA, L=Unknown, ST=Unknown, C=US"
          echo "Keystore created:"
          ls -la /tmp/raha-release.jks

      - name: Build Release AAB
        script: |
          export KEYSTORE_PATH=/tmp/raha-release.jks
          export KEYSTORE_PASSWORD=raha2026Secure
          export KEY_ALIAS=raha_key
          export KEY_PASSWORD=raha2026Secure
          cd artifacts/raha/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          ls app/build/outputs/bundle/release/
          cp app/build/outputs/bundle/release/app-release.aab $CM_BUILD_DIR/raha-release.aab

    artifacts:
      - raha-release.aab
